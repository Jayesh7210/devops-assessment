# docker-compose.prod.yml
version: '3.8'

services:
  backend:
    image: ${jayesh1207}/django-backend:latest
    container_name: django_backend_prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DJANGO_ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=*
    networks:
      - app-network

  frontend:
    image: ${jayesh1207}/react-frontend:latest
    container_name: react_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge