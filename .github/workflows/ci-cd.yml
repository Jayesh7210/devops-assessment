name: CI/CD Pipeline

on:
  push:
    branches: [main, master]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/django-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/react-frontend

jobs:
  build-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Backend
      run: |
        cd backend
        docker build -t ${{ env.BACKEND_IMAGE }}:test .
    
    - name: Build Frontend
      run: |
        cd frontend
        docker build -t ${{ env.FRONTEND_IMAGE }}:test .
    
    - name: Run Test Container
      run: |
        docker-compose -f docker-compose.yml up -d
        sleep 10
        docker-compose ps
        curl -f http://localhost:8000/health/ || exit 1
        curl -f http://localhost:80/health || exit 1
    
    - name: Cleanup
      run: docker-compose down

  push-images:
    needs: build-test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: |
          ${{ env.BACKEND_IMAGE }}:latest
          ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
    
    - name: Build and push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ env.FRONTEND_IMAGE }}:latest
          ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
    
    - name: Update Tags
      run: |
        echo "Images pushed successfully!"
        echo "Backend: ${{ env.BACKEND_IMAGE }}:latest"
        echo "Frontend: ${{ env.FRONTEND_IMAGE }}:latest"

  deploy-aws:
    needs: push-images
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Create deployment script
      run: |
        cat > deploy.sh << 'EOF'
        #!/bin/bash
        set -e
        
        echo "Deploying application to EC2..."
        
        # Pull latest images
        docker pull ${{ env.BACKEND_IMAGE }}:latest
        docker pull ${{ env.FRONTEND_IMAGE }}:latest
        
        # Create .env file
        echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" > .env
        
        # Stop and remove old containers
        docker-compose -f docker-compose.prod.yml down || true
        
        # Start new containers
        docker-compose -f docker-compose.prod.yml up -d
        
        # Wait for services to start
        sleep 10
        
        # Verify deployment
        curl -f http://localhost:8000/health/ && echo "Backend is healthy"
        curl -f http://localhost:80/health && echo "Frontend is healthy"
        
        echo "Deployment completed successfully!"
        EOF
    
    - name: Copy files to EC2
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "docker-compose.prod.yml,deploy.sh"
        target: "/home/ubuntu/app"
    
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ubuntu/app
          chmod +x deploy.sh
          ./deploy.sh