version: '3.8'

services:
  backend:
    build: ./backend
    container_name: django_backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DJANGO_ALLOWED_HOSTS=localhost,backend,127.0.0.1
      - CORS_ALLOWED_ORIGINS=http://localhost:80
    volumes:
      - ./backend/db.sqlite3:/app/db.sqlite3
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: react_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network


networks:
  app-network:
    driver: bridge